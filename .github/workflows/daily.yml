name: daily-digest
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python bot.py
      - name: Commit
        run: |
          git config user.name "bnbcast"
          git config user.email "127808721+bnbcast@users.noreply.github.com"
          git add digest
          git diff --cached --quiet || git commit -F msg.txt
          git push
